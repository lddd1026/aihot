[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihot"
version = "0.1.0"
description = "AI 每日热点雷达：每天 8:00 前把全网 AI 热点精选推送到企业微信与邮箱"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "beautifulsoup4>=4.12,<5",
    "rapidfuzz>=3.9,<4",
    "openai>=1.40,<4",
    "jinja2>=3.1,<4",
    "playwright>=1.45,<2",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "socksio>=1.0,<2",
    "tzdata>=2024.1",
]

[project.scripts]
aihot = "aihot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
